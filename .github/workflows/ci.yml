name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate SDK code and localizations
        run: ./buildlib.sh

      - name: Analyze
        # Errors only for now: lib/ carries ~80 pre-existing analyzer warnings
        # (unused imports, dead null-aware expressions, unused elements).
        # Drop --no-fatal-warnings once those are cleaned up.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test
