name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate SDK code and localizations
        run: ./buildlib.sh

      - name: Analyze
        # Errors only for now: the tree carries ~80 analyzer warnings (unused imports and
        # elements), most inside packages/ that are synced byte-identical from the
        # canonical SDK. Tighten to --fatal-warnings once those are cleaned up.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test
