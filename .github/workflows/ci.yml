name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate SDK code and localizations
        run: ./buildlib.sh

      - name: Analyze
        # Warnings are fatal. Scoped to lib/ and test/ because packages/ is a
        # byte-identical sync of the canonical SDK copy and must not be edited
        # here (it currently carries one unused_import warning of its own).
        run: flutter analyze lib test --no-fatal-infos

      - name: Test
        run: flutter test
