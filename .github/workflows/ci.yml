name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate SDK code and localizations
        run: ./buildlib.sh

      - name: No deprecated colour APIs
        # withOpacity and surfaceVariant were migrated to withValues(alpha:)
        # and surfaceContainerHighest; keep them from coming back.
        run: |
          if git grep -n '\.withOpacity(' -- 'lib/*.dart' 'test/*.dart'; then exit 1; fi
          if git grep -nw 'surfaceVariant' -- 'lib/*.dart' 'test/*.dart'; then exit 1; fi

      - name: Analyze
        # Warnings are fatal. Scoped to lib/ and test/ because packages/ is a
        # byte-identical sync of the canonical SDK copy and must not be edited
        # here (it currently carries one unused_import warning of its own).
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
